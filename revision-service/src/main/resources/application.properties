spring.application.name=revision-service
server.port=8083

# Base de datos propia del servicio (SQLite)
revision.db.url=jdbc:sqlite:revision.db

# Banco de Preguntas: Revision lo llama por REST para ejecutar las transiciones En revision / Aprobada / Rechazada
revision.banco.url=http://localhost:8082

# Mismo secreto que usa auth-service para firmar: aqui solo se verifica
auth.token.secret=dev-secret-cambiar-en-produccion-0123456789

# RabbitMQ (docker compose up -d en la raiz del repositorio)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Un mensaje que falla se reintenta 3 veces y luego se descarta (no se re-encola indefinidamente)
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
