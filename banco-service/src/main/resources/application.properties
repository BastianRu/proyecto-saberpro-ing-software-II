spring.application.name=banco-service
server.port=8082

# Base de datos propia del servicio (SQLite)
banco.db.url=jdbc:sqlite:banco.db

# Secreto para verificar la firma de tokens emitida por auth-service
banco.token.secret=dev-secret-cambiar-en-produccion-0123456789

# URL del microservicio de Validacion Estructural
banco.validation.url=http://localhost:8083

# Configuracion de RabbitMQ para eventos
banco.rabbitmq.exchange=questions.exchange
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
