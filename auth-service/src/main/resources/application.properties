spring.application.name=auth-service
server.port=8081

# Base de datos propia del servicio (SQLite)
auth.db.url=jdbc:sqlite:auth.db

# Firma del token. Cambiar el secreto en cualquier despliegue real; los demas
# servicios deben usar el mismo para verificar los tokens.
auth.token.secret=dev-secret-cambiar-en-produccion-0123456789
auth.token.ttl-minutes=60
