spring.application.name=questionbank-ddd-hexagonal
spring.datasource.url=jdbc:h2:mem:questionbank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Loads sample users, topics, competencies and questions on startup.
questionbank.sample-data.enabled=true

# Workshop 11 - mock exam context: lower bound of the time limit of an attempt
# (the limit is the sum of the estimated times of the questions, but never less than this).
questionbank.assessment.minimum-time-limit=PT20M

# Adapter of the assessment event port: "log" (default, no broker needed) or "rabbitmq".
questionbank.assessment.events=log
questionbank.assessment.rabbitmq.exchange=assessment.exchange
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
