# Broker de mensajes para la iteración 2 (eventos entre microservicios).
# Levantar:  docker compose up -d      Panel de administración: http://localhost:15672 (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
